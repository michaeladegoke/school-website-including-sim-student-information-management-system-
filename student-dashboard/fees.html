<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Fees</title>

    <link rel="stylesheet" href="../css/fee.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-content">
      <div class="topbar">
        <h1>School Fees Information</h1>
      </div>

      <!-- Summary Cards -->
      <div class="fees-summary">
        <div class="fee-card total">
          <i class="fa-solid fa-money-bill-wave"></i>
          <h2>₦100,000</h2>
          <p>Total Fees</p>
        </div>

        <div class="fee-card paid">
          <i class="fa-solid fa-circle-check"></i>
          <h2>₦50,000</h2>
          <p>Amount Paid</p>
        </div>

        <div class="fee-card balance">
          <i class="fa-solid fa-wallet"></i>
          <h2>₦50,000</h2>
          <p>Outstanding Balance</p>
        </div>
      </div>

      <!-- Fee Breakdown -->
      <div class="fees-table">
        <h2>Fee Breakdown</h2>

        <table>
          <thead>
            <tr>
              <th>Fee Item</th>
              <th>Amount</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>Tuition Fee</td>
              <td>₦60,000</td>
            </tr>

            <tr>
              <td>Examination Fee</td>
              <td>₦10,000</td>
            </tr>

            <tr>
              <td>Library Fee</td>
              <td>₦5,000</td>
            </tr>

            <tr>
              <td>Laboratory Fee</td>
              <td>₦10,000</td>
            </tr>

            <tr>
              <td>Sports Fee</td>
              <td>₦5,000</td>
            </tr>

            <tr>
              <td>ICT Fee</td>
              <td>₦10,000</td>
            </tr>

            <tr class="total-row">
              <td><strong>Total</strong></td>
              <td><strong>₦100,000</strong></td>
            </tr>
          </tbody>
        </table>

        <button class="pay-btn">
          <i class="fa-solid fa-credit-card"></i>
          Pay Balance
        </button>
      </div>
    </div>
  </body>
</html>
