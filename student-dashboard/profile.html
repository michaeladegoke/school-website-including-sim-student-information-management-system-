<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <link rel="stylesheet" href="../css/profile.css">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>
<body>

<div class="main-content">

    <div class="topbar">
        <h1>Student Profile</h1>
    </div>

    <div class="profile-card">

        <img src="https://i.pravatar.cc/150?img=12" alt="Student">

        <h2>Michael Johnson</h2>
        <p>JSS 2 Student</p>

        <hr>

        <div class="profile-info">

            <div class="info-row">
                <span><i class="fa-solid fa-id-card"></i> Admission No:</span>
                <strong>STD2025001</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-school"></i> Class:</span>
                <strong>JSS 2</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-ranking-star"></i> Position:</span>
                <strong>3rd</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-venus-mars"></i> Gender:</span>
                <strong>Male</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-calendar"></i> Date of Birth:</span>
                <strong>12 March 2012</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-phone"></i> Phone:</span>
                <strong>+234 800 123 4567</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-envelope"></i> Email:</span>
                <strong>michael@student.com</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-user-group"></i> Parent/Guardian:</span>
                <strong>Mr. Johnson</strong>
            </div>

            <div class="info-row">
                <span><i class="fa-solid fa-location-dot"></i> Address:</span>
                <strong>12 Palm Street, Lagos</strong>
            </div>

        </div>

        <button class="btn">
            <i class="fa-solid fa-pen"></i> Edit Profile
        </button>

    </div>

</div>

</body>
</html>
