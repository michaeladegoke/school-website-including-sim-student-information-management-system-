</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->
    <div class="admin-sidebar">

        <h2>Admin Panel</h2>

        <a href="admin-dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="admin-student-page.html"><i class="fas fa-user-graduate"></i> Students</a>
        <a href="admin-teacher-page.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a>
        <a href="admin-class-page.html"><i class="fas fa-school"></i> Classes</a>
        <a href="admin-subject-page.html"><i class="fas fa-book"></i> Subjects</a>
        <a href="admin-result-page.html"><i class="fas fa-file-alt"></i> Results</a>
        <a href="admin-fee-page.html"><i class="fas fa-money-bill"></i> School Fees</a>
        <a href="admin-attendance-page.html"><i class="fas fa-calendar-check"></i> Attendance</a>

        <a href="../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>

    </div>

    <!-- MAIN -->
    <div class="admin-main">

        <div class="container">

            <header class="page-header">
                <div>
                    <h1>Logout</h1>
                    <p>Confirm you want to end your session</p>
                </div>
            </header>

            <!-- MATCHING YOUR CSS logout-box -->
            <div class="logout-box">

                <i class="fas fa-sign-out-alt"></i>

                <h2>Are you sure you want to logout?</h2>
                <p>You will need to login again to access the dashboard.</p>

                <div class="logout-actions">

                    <button class="logout-btn">
                        Yes, Logout
                    </button>

                    <button class="cancel-btn">
                        Cancel
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
